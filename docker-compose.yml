version: '3'

services:
  django-web:
    build: .
    container_name: profil_periset-docker
    volumes:
      - ./static:/app/staticfiles
      - ./scholarly_proxy_rotator.py:/app/goscholar/scholarly_proxy_rotator.py
    env_file:
      - .env.prod
    environment:
      - SCHOLARLY_PROXIES=http://proxy-manager:3128  # Fallback proxy
    depends_on:
      - proxy-manager
    networks:
      - app-network

  frontend-proxy:
    image: nginx:latest
    container_name: profil_periset-nginx
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:ro
    depends_on:
      - django-web
    networks:
      - app-network

  proxy-manager:
    image: sameersbn/squid:3.5.27-2
    container_name: proxy-rotation-manager
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/cache:/var/spool/squid
    ports:
      - "3128:3128"
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge